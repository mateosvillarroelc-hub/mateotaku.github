<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <style>
        /* Diseño General (Modo Oscuro) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }

        /* Barra de Navegación Fija */
        header {
            background-color: #1a1a1a;
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px solid #6c5ce7;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        header h1 {
            margin: 0 0 15px 0;
            color: #6c5ce7;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        nav a {
            color: #a29bfe;
            text-decoration: none;
            margin: 0 15px;
            font-size: 1.1rem;
            font-weight: bold;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #ffffff;
        }

        /* Contenedor Principal */
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px;
        }

        section {
            padding-top: 100px;
            margin-bottom: 60px;
            min-height: 50vh;
        }

        h2 {
            border-bottom: 2px solid #4a4a4a;
            padding-bottom: 10px;
            margin-bottom: 30px;
            font-size: 2rem;
            color: #e0e0e0;
        }

        /* Sistema de Cuadrícula Automático */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
        }

        /* Tarjetas de cada serie */
        .card {
            background-color: #1e1e1e;
            border-radius: 10px;
            overflow: hidden;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid #333;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 15px rgba(108, 92, 231, 0.4);
            border-color: #6c5ce7;
        }

        .card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            background-color: #2d2d2d;
        }

        .card h3 {
            padding: 12px;
            margin: 0;
            font-size: 1rem;
            color: #dfe6e9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>

            let contenidoHtml = '';
            
            lista.forEach(item => {
                contenidoHtml += `
                    <div class="card">
                        <img src="${item.imagen}" alt="${item.titulo}">
                        <h3>${item.titulo}</h3>
                    </div>
                `;
            });
            
            contenedor.innerHTML = contenidoHtml;
        }
