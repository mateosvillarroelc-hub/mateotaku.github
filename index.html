<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Biblioteca Otaku</title>
    <style>
        /* Diseño General */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }

        /* Barra de Navegación */
        header {
            background-color: #1a1a1a;
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 50; /* Cambiado a 50 para que el modal quede por encima */
            border-bottom: 2px solid #6c5ce7;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        header h1 {
            margin: 0 0 15px 0;
            color: #6c5ce7;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        nav a {
            color: #a29bfe;
            text-decoration: none;
            margin: 0 15px;
            font-size: 1.1rem;
            font-weight: bold;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #ffffff;
        }

        /* Descripción Principal de la Página */
        .site-description {
            background-color: #1e1e1e;
            text-align: center;
            padding: 30px 20px;
            border-bottom: 1px solid #333;
        }

        .site-description p {
            max-width: 800px;
            margin: 0 auto;
            font-size: 1.2rem;
            line-height: 1.6;
            color: #dfe6e9;
        }

        .site-description span {
            display: block;
            margin-top: 10px;
            font-size: 0.95rem;
            color: #a29bfe;
            font-style: italic;
        }

        /* Contenedor Principal */
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px;
        }

        section {
            padding-top: 60px;
            margin-bottom: 60px;
            min-height: 50vh;
        }

        h2 {
            border-bottom: 2px solid #4a4a4a;
            padding-bottom: 10px;
            margin-bottom: 30px;
            font-size: 2rem;
            color: #e0e0e0;
        }

        /* Sistema de Cuadrícula */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
        }

        /* Tarjetas */
        .card {
            background-color: #1e1e1e;
            border-radius: 10px;
            overflow: hidden;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid #333;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 15px rgba(108, 92, 231, 0.4);
            border-color: #6c5ce7;
        }

        .card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            background-color: #2d2d2d;
        }

        .card h3 {
            padding: 12px;
            margin: 0;
            font-size: 1rem;
            color: #dfe6e9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* VENTANA EMERGENTE (MODAL) PARA CAPÍTULOS */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 2px solid #6c5ce7;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5rem;
            color: #fff;
            cursor: pointer;
            background: none;
            border: none;
        }

        .modal-title {
            margin-top: 0;
            color: #6c5ce7;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .chapter-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .chapter-btn {
            background-color: #2d2d2d;
            color: #fff;
            padding: 12px;
            text-decoration: none;
            border-radius: 5px;
            text-align: center;
            transition: background-color 0.2s;
            border: 1px solid #444;
        }

        .chapter-btn:hover {
            background-color: #6c5ce7;
        }
    </style>
</head>
<body>

    <header>
        <h1>Mi Universo Otaku</h1>
        <nav>
            <a href="#animes">Animes</a>
            <a href="#mangas">Mangas</a>
            <a href="#novelas">Novelas Ligeras</a>
        </nav>
    </header>

    <!-- DESCRIPCIÓN DE LA PÁGINA -->
    <div class="site-description">
        <p>Esta página está hecha para que los amantes del anime, manga y novela ligera puedan seguir lo que les gusta.</p>
        <span>(Esta página te redireccionará al anime, novela y manga que tú quieras ver)</span>
    </div>

    <div class="container">
        <section id="animes">
            <h2>Animes</h2>
            <div class="grid" id="grid-animes"></div>
        </section>

        <section id="mangas">
            <h2>Mangas</h2>
            <div class="grid" id="grid-mangas"></div>
        </section>

        <section id="novelas">
            <h2>Novelas Ligeras</h2>
            <div class="grid" id="grid-novelas"></div>
        </section>
    </div>

    <!-- ESTRUCTURA OCULTA DE LA VENTANA EMERGENTE -->
    <div class="modal-overlay" id="chapter-modal">
        <div class="modal-content">
            <button class="close-btn" onclick="cerrarModal()">✖</button>
            <h2 class="modal-title" id="modal-title">Título</h2>
            <div class="chapter-list" id="chapter-list">
                <!-- Los botones de los capítulos aparecerán aquí -->
            </div>
        </div>
    </div>

    <script>
        // BASE DE DATOS (AQUÍ AGREGAS LOS ENLACES A OTRAS PÁGINAS)
        
        const animes = [
            { 
                titulo: "Naruto", 
                imagen: "https://cdng.europosters.eu/pod_public/750/229900.jpg",
                capitulos: [
                    { nombre: "Capítulo 1", url: "https://tu-pagina-externa.com/naruto-ep1" },
                    { nombre: "Capítulo 2", url: "https://tu-pagina-externa.com/naruto-ep2" },
                    { nombre: "Capítulo 3", url: "https://tu-pagina-externa.com/naruto-ep3" }
                ]
            },
            { 
                titulo: "Jujutsu Kaisen", 
                imagen: "https://m.media-amazon.com/images/I/81A2y1EW1QL._AC_SY879_.jpg",
                capitulos: [
                    { nombre: "Temporada 1 - Cap 1", url: "https://link-a-jujutsu.com/cap1" },
                    { nombre: "Temporada 1 - Cap 2", url: "https://link-a-jujutsu.com/cap2" }
                ]
            }
            // Puedes seguir agregando más animes siguiendo este mismo formato...
        ];

        const mangas = [
            { 
                titulo: "Berserk", 
                imagen: "https://placehold.co/220x300/1e1e1e/a29bfe?text=Berserk",
                capitulos: [
                    { nombre: "Volumen 1", url: "https://link-manga.com/berserk-1" },
                    { nombre: "Volumen 2", url: "https://link-manga.com/berserk-2" }
                ]
            }
        ];

        const novelas = [
            { 
                titulo: "Classroom of the Elite", 
                imagen: "https://placehold.co/220x300/1e1e1e/00b894?text=Classroom+Elite",
                capitulos: [
                    { nombre: "Volumen 1 (Leer)", url: "https://link-novela.com/cote-1" }
                ]
            }
        ];

        // FUNCIÓN PARA DIBUJAR LAS TARJETAS
        function mostrarTarjetas(lista, contenedorId) {
            const contenedor = document.getElementById(contenedorId);
            let contenidoHtml = '';
            
            lista.forEach((item, index) => {
                // Convertimos el objeto a un texto para poder enviarlo al hacer clic
                const itemData = encodeURIComponent(JSON.stringify(item));
                
                contenidoHtml += `
                    <div class="card" onclick="abrirModal('${itemData}')">
                        <img src="${item.imagen}" alt="${item.titulo}">
                        <h3>${item.titulo}</h3>
                    </div>
                `;
            });
            
            contenedor.innerHTML = contenidoHtml;
        }

        // FUNCIONES DE LA VENTANA EMERGENTE (MODAL)
        function abrirModal(itemDataTexto) {
            const item = JSON.parse(decodeURIComponent(itemDataTexto));
            
            document.getElementById('modal-title').textContent = item.titulo;
            
            const chapterList = document.getElementById('chapter-list');
            chapterList.innerHTML = ''; // Limpiar capítulos anteriores

            if (item.capitulos && item.capitulos.length > 0) {
                item.capitulos.forEach(cap => {
                    // target="_blank" hace que el enlace se abra en una pestaña nueva
                    chapterList.innerHTML += `
                        <a href="${cap.url}" target="_blank" class="chapter-btn">${cap.nombre}</a>
                    `;
                });
            } else {
                chapterList.innerHTML = '<p style="color: #ccc; text-align: center;">Próximamente agregaremos enlaces...</p>';
            }

            document.getElementById('chapter-modal').style.display = 'flex';
        }

        function cerrarModal() {
            document.getElementById('chapter-modal').style.display = 'none';
        }

        // Cerrar ventana si se hace clic afuera del recuadro
        window.onclick = function(event) {
            const modal = document.getElementById('chapter-modal');
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }

        // CARGAR LAS SECCIONES
        mostrarTarjetas(animes, 'grid-animes');
        mostrarTarjetas(mangas, 'grid-mangas');
        mostrarTarjetas(novelas, 'grid-novelas');
    </script>
</body>
</html>
