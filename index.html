<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Biblioteca Otaku</title>
    <style>
        /* Diseño General */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }

        /* Barra de Navegación */
        header {
            background-color: #1a1a1a;
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 50;
            border-bottom: 2px solid #6c5ce7;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        header h1 {
            margin: 0 0 15px 0;
            color: #6c5ce7;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        nav a {
            color: #a29bfe;
            text-decoration: none;
            margin: 0 15px;
            font-size: 1.1rem;
            font-weight: bold;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #ffffff;
        }

        /* Descripción Principal de la Página */
        .site-description {
            background-color: #1e1e1e;
            text-align: center;
            padding: 30px 20px;
            border-bottom: 1px solid #333;
        }

        .site-description p {
            max-width: 800px;
            margin: 0 auto;
            font-size: 1.2rem;
            line-height: 1.6;
            color: #dfe6e9;
        }

        .site-description span {
            display: block;
            margin-top: 10px;
            font-size: 0.95rem;
            color: #a29bfe;
            font-style: italic;
        }

        /* Contenedor Principal */
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px;
        }

        section {
            padding-top: 60px;
            margin-bottom: 60px;
            min-height: 50vh;
        }

        h2 {
            border-bottom: 2px solid #4a4a4a;
            padding-bottom: 10px;
            margin-bottom: 30px;
            font-size: 2rem;
            color: #e0e0e0;
        }

        /* Sistema de Cuadrícula */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
        }

        /* Tarjetas */
        .card {
            background-color: #1e1e1e;
            border-radius: 10px;
            overflow: hidden;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid #333;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 15px rgba(108, 92, 231, 0.4);
            border-color: #6c5ce7;
        }

        .card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            background-color: #2d2d2d;
        }

        .card h3 {
            padding: 12px;
            margin: 0;
            font-size: 1rem;
            color: #dfe6e9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* VENTANA EMERGENTE (MODAL) PARA CAPÍTULOS */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 2px solid #6c5ce7;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5rem;
            color: #fff;
            cursor: pointer;
            background: none;
            border: none;
        }

        .modal-title {
            margin-top: 0;
            color: #6c5ce7;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .chapter-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .chapter-btn {
            background-color: #2d2d2d;
            color: #fff;
            padding: 12px;
            text-decoration: none;
            border-radius: 5px;
            text-align: center;
            transition: background-color 0.2s;
            border: 1px solid #444;
        }

        .chapter-btn:hover {
            background-color: #6c5ce7;
        }
    </style>
</head>
<body>

        function mostrarTarjetas(lista, contenedorId) {
            const contenedor = document.getElementById(contenedorId);
            let contenidoHtml = '';
            
            lista.forEach((item) => {
                const itemData = encodeURIComponent(JSON.stringify(item));
                
                contenidoHtml += `
                    <div class="card" onclick="abrirModal('${itemData}')">
                        <img src="${item.imagen}" alt="${item.titulo}">
                        <h3>${item.titulo}</h3>
                    </div>
                `;
            });
            
            contenedor.innerHTML = contenidoHtml;
        }

        function abrirModal(itemDataTexto) {
            const item = JSON.parse(decodeURIComponent(itemDataTexto));
            
            document.getElementById('modal-title').textContent = item.titulo;
            
            const chapterList = document.getElementById('chapter-list');
            chapterList.innerHTML = ''; 

            if (item.capitulos && item.capitulos.length > 0) {
                item.capitulos.forEach(cap => {
                    chapterList.innerHTML += `
                        <a href="${cap.url}" target="_blank" class="chapter-btn">${cap.nombre}</a>
                    `;
                });
            } else {
                chapterList.innerHTML = '<p style="color: #ccc; text-align: center;">Próximamente agregaremos enlaces...</p>';
            }

            document.getElementById('chapter-modal').style.display = 'flex';
        }

        function cerrarModal() {
            document.getElementById('chapter-modal').style.display = 'none';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('chapter-modal');
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }

        mostrarTarjetas(animes, 'grid-animes');
        mostrarTarjetas(mangas, 'grid-mangas');
        mostrarTarjetas(novelas, 'grid-novelas');
